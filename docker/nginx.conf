upstream loto_api {
  server api-1:4101 max_fails=0;
  server api-2:4101 max_fails=0;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API 请求在两个实例间轮询；两实例共享同一 PostgreSQL 裁决
  location /api/ {
    proxy_pass http://loto_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 撤锁/复位可能因行锁短暂排队，给足等待时间
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  # 单页应用回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
